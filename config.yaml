# Конфигурация flowbatch. Ничего не хардкодится в коде — всё правится здесь.

cdp:
  # Браузер запускается вручную. Подойдёт любой на Chromium (Edge, Chrome) —
  # скрипту важен только порт, а не марка браузера.
  #
  #   Edge:   & "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" `
  #             --remote-debugging-port=9222 --user-data-dir="C:\edge-flow-profile"
  #   Chrome: chrome.exe --remote-debugging-port=9222 --user-data-dir="C:\chrome-flow-profile"
  #
  # ВАЖНО: --user-data-dir обязан быть НЕ дефолтным. Chromium 136+ (и Edge 136+)
  # игнорируют --remote-debugging-port на профиле по умолчанию. Отсюда следствие:
  # это отдельный чистый профиль, и в Google в нём нужно залогиниться один раз
  # руками. Дальше сессия живёт в этой папке.
  endpoint: "http://localhost:9222"

  # Чтобы не набирать команду выше руками — `flowbatch browser` или кнопка
  # «Запустить браузер» в панели. Запускается ТВОЙ Edge на ТВОЁМ профиле,
  # сессия берётся из папки, где ты залогинился сам.
  browser_path: ""                        # пусто -> найти Edge, потом Chrome
  user_data_dir: "C:\\edge-flow-profile"  # ОБЯЗАН быть не дефолтным (см. выше)
  start_url: "https://labs.google/fx/ru/tools/flow"
  # По какой подстроке искать нужную вкладку среди уже открытых.
  # Скрипт НЕ навигирует и НЕ открывает новых вкладок — работает с тем, что открыл ты.
  page_url_match: "labs.google/fx"

# Русский интерфейс. При смене локали правь только этот блок.
# Всё остальное селектится по ролям и стабильным data-/aria-атрибутам,
# от языка не зависит.
locale:
  create_button: "Создать"          # и «+», и кнопка отправки — различаются по aria-haspopup
  clear_request: "Очистить запрос"  # чистит и промпт, и прикреплённые референсы
  add_to_request: "Добавить в запрос"
  rename_media: "Переименовать"   # пункт меню плитки библиотеки
  create_project: "Создать проект"
  back_button: "Назад"
  picker_tab_all: "Все"             # табы типов в «+»-пикере
  picker_tab_images: "Изображения"

selectors:
  prompt_editor: '[data-slate-editor="true"]'

  # Общий на всё приложение input. ВНИМАНИЕ: он грузит файл в БИБЛИОТЕКУ проекта,
  # а не прикрепляет референс к запросу. Прикрепление — отдельный flow через «+».
  file_input: 'input[type=file][accept="image/*"]'

  # Прикреплённые референсы: чипы над редактором, у каждого <i>cancel</i>.
  ref_chip: 'button[data-card-open]'

  # Пикер медиа за кнопкой «+» (единственная кнопка с aria-haspopup=dialog).
  add_dialog_trigger: 'button[aria-haspopup="dialog"]'
  add_dialog: '[role=dialog]'
  add_search: '#add-menu-input'
  add_row: '[role=dialog] [data-testid="virtuoso-item-list"] > div'
  add_scroller: '[role=dialog] [data-testid="virtuoso-scroller"]'

  # Триггер меню настроек. НЕ по имени модели: в режиме «Видео» модель другая
  # (Omni Flash), и button:has-text("Nano Banana") даёт 0 совпадений.
  # Общий признак обоих режимов — токен crop_ в тексте кнопки. Проверено: ровно 1.
  settings_trigger: 'button[aria-haspopup="menu"]:has-text("crop_")'
  settings_menu: '[role=menu][data-radix-menu-content]'

  # Табы внутри меню настроек. Собственные id вида radix-:r7i: генерируются
  # заново при каждом рендере — селектить по ним нельзя, как и по классам sc-*.
  # Стабилен хвост aria-controls: ...-content-PORTRAIT, ...-content-VIDEO и т.д.
  tab_template: '[role=tab][aria-controls$="-content-{token}"]'

  # Имя проекта в шапке. id настоящий, не radix-хэш. Поиск по библиотеке лежит
  # в <form> внутри той же шапки, а имя — в <nav>, поэтому пересечения нет
  # и локаль-зависимый aria-label не нужен.
  project_title: '#flow-desktop-header nav input[type="text"]'

  search_input: '[data-testid="search-input"]'
  virtuoso_scroller: '[data-testid="virtuoso-scroller"]'
  virtuoso_item_list: '[data-testid="virtuoso-item-list"]'
  result_video: 'video[src*="getMediaUrlRedirect"]'
  result_image: 'img[src*="getMediaUrlRedirect"]'

generation:
  # Обязательная проверка перед каждым запуском: если формат не этот — не запускаем.
  required_aspect: "crop_9_16"
  # Таб, соответствующий required_aspect (хвост aria-controls).
  aspect_tab: "PORTRAIT"
  # Сколько результатов за запуск. Спека рассчитана на 1 файл = 1 задача.
  batch: 1

  # Табы типа генерации.
  kind_tabs:
    image: "IMAGE"
    video: "VIDEO"

  # Подрежим видео: VIDEO_REFERENCES («Образцы», картинка как референс)
  # или VIDEO_FRAMES («Кадры», картинка как первый кадр).
  video_mode: "VIDEO_REFERENCES"
  # Длительность видео по умолчанию. Перебивается полем duration в jobs.yaml.
  video_duration_sec: 8
  allowed_durations: [4, 6, 8, 10]

  image_timeout_sec: 180
  video_timeout_sec: 900
  poll_interval_sec: 3
  # Ждём, пока кнопка «Создать» станет aria-disabled="false"
  ready_timeout_sec: 60

  # Скачивать ли готовые файлы в out/. Выключено: результат остаётся в
  # библиотеке Flow (в журнал пишется его uuid), очередь идёт заметно бодрее.
  # Забрать файлы потом одной командой: flowbatch fetch
  # Вернуть скачивание на лету — поменяй на true.
  download_results: false

  # Переименование результата в самом Flow сразу после успешной генерации.
  # Плитка получает имя задачи (sahdom_p01_08_cliffhanger_anim) вместо
  # придуманного Flow («Tooth characters talking in shop») — так отрывок
  # видно в библиотеке и его не спутать при монтаже.
  # Делается в окне ожидания, до скачивания, и только после успеха: если
  # генерацию завернули, имя получит уже удачная перегенерация.
  # Шаблон: {id} — id задачи, {name} — исходное имя Flow, {n} — сквозной
  # номер внутри проекта. Пустой шаблон выключает функцию.
  rename_pattern: "{id}"

  # Для каких типов результатов переименовывать. Картинки — промежуточные
  # кадры, они нужны только как референс для видео и в монтаж не идут,
  # поэтому по умолчанию трогаем одни ролики. Полный список: [image, video].
  rename_kinds: ["video"]

# Модерация: как ловить отказы и что с ними делать.
moderation:
  # Надписи на странице, по которым распознаётся отказ модерации.
  # Регистр не важен. Дополняй список, когда Flow покажет новую формулировку —
  # текст ошибки задачи всегда содержит кусок страницы вокруг найденной фразы.
  phrases:
    - "может нарушать наши правила"
    - "нарушает наши правила"
    - "не соответствует нашим правилам"
    - "не удалось создать"
    - "may violate our policies"
    - "violates our policies"
    - "wasn't able to create"
    # Общие хвосты многих отказов Flow — ловят и формулировки, которых ещё
    # нет в списке выше. Реакция на любую из фраз одна: лестница переписываний.
    - "измените запрос и повторите"
    - "change your request and try again"
    - "попробуйте ввести другой запрос"
    - "try a different prompt"

  # Транзиентные сбои: «Мы заметили подозрительную активность» и подобные.
  # Это НЕ про содержание промпта — переписывать нечего. Реакция: длинная
  # пауза и перезапуск той же задачи (до antiban.max_retries раз).
  # Очередь при этом НЕ останавливается.
  phrases_unusual:
    - "подозрительн"          # …ую активность / …ая активность
    - "suspicious activity"
    - "повторите попытку позже"
    - "try again later"

  # Отдельная категория отказа: «…не могу создать такое видео из-за интересов
  # сторонних поставщиков контента». Это не про жестокость, а про сходство
  # с чужим контентом (сериал, знаменитость, бренд) — тут промпт переписывается
  # КАРДИНАЛЬНО (другой сеттинг и образы), а не смягчается по словам.
  phrases_third_party:
    - "сторонних поставщиков контента"
    - "third-party content"

  soften:
    enabled: true
    # Сколько ЗАХОДОВ по лестнице делать. Если все attempts ступеней одним
    # бэкендом не помогли, программа переключается на следующий доступный
    # (Ollama -> Gemini -> Claude -> правила) и проходит лестницу заново,
    # начиная с ИСХОДНОГО промпта: свежая модель должна получить настоящую
    # сцену, а не текст, изжёванный девятью переписываниями.
    passes: 2

    # Сколько раз переписывать промпт и перезапускать задачу за ОДИН заход,
    # прежде чем сдаться. Лестница попыток (температура: 0.2 на 1-2, дальше
    # растёт до 0.9 — сначала минимум творчества, потом разнообразие):
    #   1     — точечное смягчение (минимум правок);
    #   2     — агрессивнее;
    #   3     — ТОЛЬКО реплики из промпта, по-русски, без описаний
    #           (иногда Flow такое пропускает);
    #   4-6   — всё смелее: спорные детали убираются целиком;
    #   7-9   — радикально: реплики + бренд + суть кадра, остальное нейтрально.
    attempts: 9
    # auto — Ollama, если сервер поднят и модель скачана (бесплатно, локально,
    # без сети наружу); иначе Gemini при наличии GEMINI_API_KEY; иначе Claude
    # при наличии ANTHROPIC_API_KEY; иначе правила.
    # Зафиксировать: rules | ollama | gemini | claude
    backend: "auto"

    # Локальная модель. ВАЖНО: должна целиком влезать в VRAM видеокарты,
    # иначе часть слоёв уходит в оперативку и скорость падает в разы.
    # Ориентир для 12 ГБ (RTX 5070): модели 12–14B в Q4 весят 7–9 ГБ — влезают
    # с запасом на контекст; 30B+ весят ~18 ГБ и уже не помещаются.
    ollama_model: "gemma4:12b"
    ollama_host: ""              # пусто -> OLLAMA_HOST или http://localhost:11434
    ollama_timeout_sec: 300      # локальная генерация медленнее облачной
    # Окно контекста: дефолт Ollama мал, и промпт на 4000+ символов вместе с
    # инструкцией молча обрезался бы. Больше окно -> больше занятой VRAM.
    ollama_num_ctx: 16384
    ollama_num_predict: 4096     # запас на ответ (он примерно равен входу)
    # Цепочка моделей Gemini: кончилась квота (429), модель прилегла (503)
    # или снята (404) — программа сама переходит к следующей и запоминает
    # рабочую до конца прогона. Свой список: soften-test.
    #
    # Замерено на нашем ключе: отвечает только flash-семейство. У pro везде
    # 429 (бесплатной квоты нет), gemini-2.5-flash и 2.5-flash-lite сняты
    # с обслуживания (404).
    #
    # Время ответа сильно скачет от загрузки серверов Google: одна и та же
    # gemini-flash-lite-latest на замерах давала и 0.9с, и 64с. Поэтому
    # порядок здесь по уровню модели, а не по секундомеру — всё равно
    # цепочка сама перешагнёт ту, что не ответила.
    #
    # ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ: gemma-4-26b-a4b-it и gemma-4-31b-it на ключе
    # есть, но для нашей задачи негодны — они не переписывают промпт, а
    # пересказывают инструкцию списком (ответ в 14-17 раз длиннее исходника,
    # 38-56с). Проверены две разные подачи, результат один. У Gemma нет
    # системной роли, и инструкция читается ею как текст для разбора.
    gemini_models:
      - "gemini-flash-latest"        # алиас на актуальную flash
      - "gemini-3.6-flash"
      - "gemini-3.5-flash"
      - "gemini-flash-lite-latest"
      - "gemini-3.5-flash-lite"
      - "gemini-3-flash-preview"     # последний рубеж
    # Устаревшее поле на одну модель. Если задано и списка нет — работает оно.
    gemini_model: "gemini-flash-latest"
    claude_model: "claude-opus-5"

    # Claude через CLI — работает по ПОДПИСКЕ, ключ не нужен вообще.
    # Ставится отдельно от десктопного приложения (у него нет режима -p):
    #   irm https://claude.ai/install.ps1 | iex
    # Путь ищется в PATH и обычных местах установки; можно задать явно.
    claude_cli_path: ""              # пусто -> искать самому
    claude_cli_model: "opus"         # алиас или полное имя модели
    # Усилие рассуждений: low | medium | high | xhigh | max (флаг --effort).
    # Стоит medium, а не high: переписать промпт помягче — задача на
    # следование инструкции, а не на логику. Высокое усилие здесь дольше
    # считает и быстрее ест лимиты подписки, не улучшая результат.
    # Ставь high, если дошло до 7-9 ступеней и сцену надо ломать радикально.
    claude_cli_effort: "medium"
    # Куда переключаться, если opus перегружен или недоступен (флаг
    # --fallback-model, список через запятую). Та же логика, что у цепочки
    # моделей Gemini, только её ведёт сам CLI.
    claude_cli_fallback: "sonnet"
    claude_cli_timeout_sec: 300      # запуск процесса медленнее HTTP
    claude_cli_args: []              # что-то ещё, если понадобится

    # Бэкенд «rules» (офлайн): замены слов + смягчающая добавка к промпту.
    # Попытка 1 — только добавка; попытка 2 — ещё и замены/вычистка слов.
    replacements:
      "blood": "red paint"
      "bloody": "messy"
      "gore": ""
      "gory": ""
      "knife": "spoon"
      "gun": "toy prop"
      "weapon": "prop"
      "kill": "stop"
      "dead": "sleepy"
      "creepy": "quirky"
      "scary": "silly"
      "horror": "cartoon"
    suffix: >-
      Wholesome family-friendly cartoon for a general audience. No violence,
      no injuries, no weapons, no scary or unsettling imagery, no anatomical
      details, fully clothed characters, kind expressions, bright safe mood.

antiban:
  # ВАЖНО: в параллельном режиме ритм общий на все прогоны, и паузы
  # СКЛАДЫВАЮТСЯ в очередь. При 7 слотах пауза 30с давала ожидание под
  # 240с у последнего в очереди. Отсюда умеренные значения — а если Flow
  # всё-таки пожалуется на активность, паузы поднимутся сами (см. ниже).
  pause_between_jobs_sec: 12
  pause_jitter_sec: 5       # итоговая пауза = pause ± jitter
  # Относится только к команде run — она всегда работает в одну вкладку.
  # Параллельный прогон настраивается в панели (flowbatch ui): там отмечаешь
  # 2–3 открытые вкладки Flow, и очередь идёт по ним сразу. Паузы при этом
  # остаются общими на все вкладки, то есть запросов в минуту столько же.
  concurrency: 1            # жёсткий потолок 3, выше не поднимается
  long_pause_every: 15      # после каждых N задач — длинная пауза
  long_pause_sec: 120
  max_retries: 3            # для 429/5xx, экспоненциальный бэкофф

  # Если Flow пожаловался на подозрительную активность — паузы умножаются
  # на этот коэффициент до конца прогона, и в Telegram уходит уведомление.
  # Задача при этом не теряется: она перегенерируется уже в новом, более
  # спокойном ритме. Каждая новая жалоба замедляет ещё раз, до потолка.
  slowdown_factor: 2.5
  slowdown_max_base_sec: 90     # потолок обычной паузы после замедлений
  slowdown_max_long_sec: 600    # потолок длинной паузы

paths:
  out_dir: "out"
  runs_log: "runs.jsonl"
  screenshots_dir: "screenshots"
  # Куда складывать файлы очередей. Сюда же панель пишет вставленный текст
  # (pasted_<номер прогона>.flow.txt). Имя без пути в поле «очередь» ищется
  # сначала здесь, потом рядом с программой — так старые пути не ломаются.
  prompts_dir: "prompts"

  # База продуктов: подпапка на продукт, внутри — его фото.
  #   products/rl410/front.jpg  ->  в промпте: @product rl410
  # При прогоне фото заливаются в текущий проект Flow автоматически
  # (один раз на проект, дальше берутся из кэша по uuid).
  products_dir: "products"
